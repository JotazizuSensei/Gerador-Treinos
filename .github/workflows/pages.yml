name: Validate and deploy BLUE Symbiote

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate production package
        shell: bash
        run: |
          set -euo pipefail
          for f in index.html manifest.json service-worker.js patch-10.0.3.js patch-10.0.4.js patch-10.0.5.js patch-10.0.6.js patch-10.0.7.js patch-10.0.8.js patch-10.0.11.js patch-10.0.12.js patch-10.1.0.js patch-10.2.0-auth.js payload-1a.txt payload-1b.txt payload-1c.txt payload-1d.txt payload-2a.txt payload-2b.txt payload-2c.txt payload-2d.txt payload-3.txt payload-4.txt icon-180.png icon-192.png icon-512.png icon-512-maskable.png; do
            test -s "$f" || { echo "Missing or empty: $f"; exit 1; }
          done
          python - <<'PY'
          import base64,gzip,hashlib,json,pathlib,re
          expected='0090f2c7066f9aed2fc9567933851d82d95eaadef02f1cc5dead7aa83da17098'
          names=['payload-1a.txt','payload-1b.txt','payload-1c.txt','payload-1d.txt','payload-2a.txt','payload-2b.txt','payload-2c.txt','payload-2d.txt','payload-3.txt','payload-4.txt']
          b64=''.join(pathlib.Path(n).read_text(encoding='utf-8').strip() for n in names)
          raw=gzip.decompress(base64.b64decode(b64))
          digest=hashlib.sha256(raw).hexdigest()
          assert digest==expected,(digest,expected)
          html=raw.decode('utf-8')
          assert html.count('"id":"EX')==397,html.count('"id":"EX')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,flags=re.S|re.I)
          pathlib.Path('/tmp/blue-app.js').write_text('\n'.join(scripts),encoding='utf-8')
          manifest=json.loads(pathlib.Path('manifest.json').read_text(encoding='utf-8'))
          assert manifest['scope']=='./'
          assert '10.2.0' in manifest['start_url']
          outer=pathlib.Path('index.html').read_text(encoding='utf-8')
          assert expected in outer
          assert '10.2.0' in outer
          assert 'patch-10.2.0-auth.js' in outer
          assert 'getRegistrations' not in outer
          oscripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',outer,flags=re.S|re.I)
          pathlib.Path('/tmp/index.js').write_text('\n'.join(oscripts),encoding='utf-8')
          auth=pathlib.Path('patch-10.2.0-auth.js').read_text(encoding='utf-8')
          for token in ['BLUE SYMBIOTE','RECUPERAR PALAVRA-PASSE','blue_symbiote_members','blue_symbiote_state','SINCRONIZADO','serviceWorker.register']:
            assert token in auth,token
          sw=pathlib.Path('service-worker.js').read_text(encoding='utf-8')
          assert "VERSION='10.2.0'" in sw
          assert 'patch-10.2.0-auth.js' in sw
          print('BLUE v10.2.0 package verified:',len(raw),'bytes')
          PY
          node --check /tmp/blue-app.js
          node --check /tmp/index.js
          node --check service-worker.js
          node --check patch-10.0.3.js
          node --check patch-10.0.4.js
          node --check patch-10.0.5.js
          node --check patch-10.0.6.js
          node --check patch-10.0.7.js
          node --check patch-10.0.8.js
          node --check patch-10.0.11.js
          node --check patch-10.0.12.js
          node --check patch-10.1.0.js
          node --check patch-10.2.0-auth.js

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
