<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BLUE Symbiote — Atualizar</title><style>body{font-family:Arial,sans-serif;background:#edf3f7;color:#17212b;margin:0;padding:24px}.card{max-width:640px;margin:40px auto;background:#fff;border-radius:16px;padding:22px;box-shadow:0 12px 36px rgba(0,0,0,.08)}button{background:#0b5f9e;color:#fff;border:0;border-radius:10px;padding:12px 16px;font-weight:800;font-size:16px;cursor:pointer}.ok{background:#eaf6ec;padding:12px;border-radius:10px;margin:12px 0}.warn{background:#fff4e5;padding:12px;border-radius:10px;margin:12px 0}.small{font-size:13px;line-height:1.5}</style></head><body><div class="card"><h1>BLUE Symbiote — atualizar</h1><p>Este ecrã força a app instalada a largar o service worker antigo e a receber a versão atual. <b>Não apaga histórico, imagens, preferências nem dados locais.</b></p><div id="status" class="warn">A verificar…</div><button id="go">FORÇAR ATUALIZAÇÃO</button><p class="small">Versão alvo: <b>10.0.9</b>. No fim, a app abre automaticamente.</p></div><script>(()=>{const TARGET='10.0.9',s=document.getElementById('status'),b=document.getElementById('go');async function probe(){try{const r=await fetch('./index.html?probe='+Date.now(),{cache:'no-store'}),t=await r.text();s.className='ok';s.innerHTML='Servidor responde. '+(t.includes('10.0.9')?'<b>v10.0.9 já publicada.</b>':'A publicação ainda está a propagar; podes tentar na mesma.')}catch(e){s.textContent='Não consegui verificar o servidor nesta abertura.'}}async function force(){b.disabled=true;s.className='warn';s.textContent='A atualizar…';try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();for(const r of regs){try{await r.unregister()}catch(e){}}await new Promise(r=>setTimeout(r,500));const reg=await navigator.serviceWorker.register('./service-worker.js?v='+TARGET,{scope:'./',updateViaCache:'none'});try{await reg.update()}catch(e){}if(reg.waiting)reg.waiting.postMessage({type:'SKIP_WAITING'});}s.className='ok';s.innerHTML='<b>Atualização forçada.</b> A abrir a app…';setTimeout(()=>location.replace('./?v='+TARGET+'&force='+Date.now()+'&view=config'),900)}catch(e){s.className='warn';s.textContent='Falha a forçar atualização: '+String(e);b.disabled=false}}b.onclick=force;probe()})();</script></body></html>
